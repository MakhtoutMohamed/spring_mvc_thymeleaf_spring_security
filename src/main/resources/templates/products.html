<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<div class="p-3" layout:fragment="content">
    <div class="card">
        <div class="card-header">Liste des produits</div>
        <div class="card-body">
            <div class="p-3" sec:authorize="hasRole('ADMIN')">
                <a class="btn btn-primary" th:href="@{/admin/newProduct}">Nouveau Produit</a>
            </div>
            <!-- form de recherche -->
            <form method="get" th:action="@{/user/index}" class="row g-3">
                <div class="col-auto">
                    <label for="keyword" class="visually-hidden">Mot clé</label>
                    <input type="text" name="keyword" class="form-control" id="keyword" placeholder="Mot clé" th:value="${keyword}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-info mb-3">Chercher</button>
                </div>
            </form>

            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prix</th>
                    <th>Quantité</th>
                    <th sec:authorize="hasRole('ADMIN')">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p:${productsList}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.price}"></td>
                    <td th:text="${p.quantity}"></td>
                    <td sec:authorize="hasRole('ADMIN')" class="d-flex">
                        <!-- form envoie bien une req POST -->
                        <form class="me-2" method="post" th:action="@{/admin/delete}" onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer ce produit?');">
                            <!-- champs cachés pour passer les parametres -->
                            <input type="hidden" name="id" th:value="${p.id}">
                            <input type="hidden" name="keyword" th:value="${keyword}">
                            <input type="hidden" name="page" th:value="${currentPage}">
                            <button type="submit" class="btn btn-danger">Supprimer</button>
                        </form>
                        <a class="btn btn-success" th:href="@{/admin/editProduct(id=${p.id}, keyword=${keyword}, page=${currentPage})}">
                            Éditer
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
            <!-- pagination -->
            <nav aria-label="Page navigation">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                        <a class="page-link" th:href="@{/user/index(page=${(currentPage - 1)}, keyword=${keyword})}">Précédent</a>
                    </li>
                    <li class="page-item" th:each="page,status:${pages}" th:classappend="${currentPage==status.index}?'active':''">
                        <a class="page-link" th:text="${status.index + 1}" th:href="@{/user/index(page=${status.index}, keyword=${keyword})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                        <a class="page-link" th:href="@{/user/index(page=${(currentPage + 1)}, keyword=${keyword})}">Suivant</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
