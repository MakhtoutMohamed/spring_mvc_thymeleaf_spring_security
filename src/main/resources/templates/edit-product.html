<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
  <meta charset="UTF-8">
  <title>Éditer Produit</title>
</head>
<body>
<div class="p-3" layout:fragment="content">
  <div class="card">
    <div class="card-header">Édition du Produit</div>
    <div class="card-body">
      <form method="post" th:action="@{/admin/saveProduct}">
        <!-- champ caché pour id -->
        <input type="hidden" name="id" th:value="${product.id}">
        <div class="mb-3">
          <label class="form-label">Nom</label>
          <input class="form-control" type="text" name="name" th:value="${product.name}">
          <span class="text-danger" th:errors="${product.name}"></span>
        </div>
        <div class="mb-3">
          <label class="form-label">Prix</label>
          <input class="form-control" type="number" step="0.01" name="price" th:value="${product.price}">
          <span class="text-danger" th:errors="${product.price}"></span>
        </div>
        <div class="mb-3">
          <label class="form-label">Quantité</label>
          <input class="form-control" type="number" name="quantity" th:value="${product.quantity}">
          <span class="text-danger" th:errors="${product.quantity}"></span>
        </div>
        <button type="submit" class="btn btn-primary">Mettre à jour</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
